<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-label="Blue arc reactor background">
  <defs>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6faff" />
      <stop offset="25%" stop-color="#9ae6ff" />
      <stop offset="55%" stop-color="#4fd0ff" />
      <stop offset="100%" stop-color="#0a7bff" />
    </radialGradient>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd0ff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#1a8cff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#051826" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1a8cff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8fd8ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <g>
    <circle cx="800" cy="800" r="700" fill="url(#reactorGlow)" opacity="0.35" />
    <g opacity="0.85">
      <circle cx="800" cy="800" r="460" fill="none" stroke="url(#ringStroke)" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 26" />
      <circle cx="800" cy="800" r="420" fill="none" stroke="#7fc8ff" stroke-width="6" opacity="0.9" />
      <circle cx="800" cy="800" r="380" fill="none" stroke="#9fd9ff" stroke-width="4" stroke-dasharray="6 12" opacity="0.8" />
      <circle cx="800" cy="800" r="340" fill="none" stroke="#4f9bff" stroke-width="8" opacity="0.7" />
      <circle cx="800" cy="800" r="300" fill="none" stroke="#7fc8ff" stroke-width="4" stroke-dasharray="10 14" opacity="0.8" />
      <circle cx="800" cy="800" r="260" fill="none" stroke="#a6e3ff" stroke-width="6" opacity="0.85" />
    </g>
    <circle cx="800" cy="800" r="200" fill="url(#reactorCore)" filter="url(#coreGlow)" />
  </g>
</svg>